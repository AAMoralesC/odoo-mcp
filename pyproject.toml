[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-mcp"
version = "0.1.0"
description = "Servidor MCP que expone el ORM de Odoo a agentes de IA (lectura segura por defecto)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Andrés Morales", email = "andresdremc@gmail.com" }]
keywords = ["odoo", "mcp", "model-context-protocol", "ai", "agent", "erp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/AAMoralesC/odoo-mcp"
Repository = "https://github.com/AAMoralesC/odoo-mcp"
Issues = "https://github.com/AAMoralesC/odoo-mcp/issues"

[project.scripts]
odoo-mcp = "odoo_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_mcp"]
